name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Nightly packaging regression: catches spec/version drift that only
  # surfaces at PyInstaller build time (see nightly-packaging job).
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pytest pytest-cov

    - name: Run tests (Linux headless)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
        DISPLAY: :99
      run: |
        sudo apt-get update && sudo apt-get install -y \
          xvfb \
          libgl1 \
          libegl1 \
          libglib2.0-0 \
          libxkbcommon0 \
          libxkbcommon-x11-0 \
          libdbus-1-3 \
          libxcb-cursor0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libfontconfig1 \
          libfreetype6 \
          libnss3 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libxi6
        xvfb-run -a python -m pytest tests -q --cov=pi_manager --cov-report=term-missing --cov-fail-under=55

    - name: Run tests (Windows/macOS)
      if: runner.os != 'Linux'
      run: |
        python -m pytest tests -q --cov=pi_manager --cov-report=term-missing --cov-fail-under=55

    - name: Self-check
      run: |
        python main.py --self-check

  # Nightly-only Linux packaging smoke. Kept separate from `test` so pull
  # requests never pay the PyInstaller cost; scheduled runs exercise the
  # spec chain (shared config extraction, version resource, smoke binary).
  nightly-packaging:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Linux GUI / smoke deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libfontconfig1 \
            libfreetype6 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxi6

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Run tests (Linux headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" python -m pytest tests -q -p no:cacheprovider --cov=pi_manager --cov-report=term-missing --cov-fail-under=55

      - name: Resolve version from extras.py
        id: ver
        shell: bash
        run: |
          echo "version=$(python -c "import re,pathlib;m=re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"',pathlib.Path('pi_manager/extras.py').read_text(encoding='utf-8'));print(m.group(1) if m else '0.0.0')")" >> "$GITHUB_OUTPUT"

      - name: PyInstaller (directory)
        run: python -m PyInstaller --noconfirm --clean PiManager.spec

      - name: Smoke test packaged binary
        shell: bash
        run: |
          export QT_QPA_PLATFORM=offscreen
          python scripts/smoke_test_dist.py \
            --platform linux \
            --dist dist \
            --expected-version "${{ steps.ver.outputs.version }}"

      - name: Upload nightly artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PiManager-nightly-linux
          path: dist/PiManager
          if-no-files-found: error
