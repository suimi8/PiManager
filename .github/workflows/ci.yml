name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Nightly packaging regression: catches spec/version drift that only
  # surfaces at PyInstaller build time (see nightly-packaging job).
  # 同一 schedule 也跑供应链审计（supply-chain job）。
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

# 连续 push 时取消上一轮：此前旧的 6 个矩阵 job 会跑完才停，白烧 runner 时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    # 全流水线此前零 timeout-minutes：一条挂起的用例能把 job 跑满 GitHub 默认的
    # 6 小时，6 个矩阵组合合计最多烧 36 小时（审查 P2-4）。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 与 pyproject.toml 的 requires-python = ">=3.11" 和 ruff
        # target-version = "py311" 对齐；3.10 已从文档中移除（此前文档承诺 3.10+
        # 但 CI 从未验证过它）。
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        # 6 个矩阵 job 此前每次都重新下载 PySide6（约 90 MB wheel）。
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      # 统一走 requirements-dev.txt：此前是无版本约束的 `pip install pytest
      # pytest-cov`，钉死的版本形同虚设，本地过了不代表 CI 过（审查 P1-4）。
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt -r requirements-dev.txt

    - name: Run tests (Linux headless)
      if: runner.os == 'Linux'
      env:
        QT_QPA_PLATFORM: offscreen
        DISPLAY: :99
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y \
          xvfb \
          libgl1 \
          libegl1 \
          libglib2.0-0 \
          libxkbcommon0 \
          libxkbcommon-x11-0 \
          libdbus-1-3 \
          libxcb-cursor0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libfontconfig1 \
          libfreetype6 \
          libnss3 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libxi6
        xvfb-run -a python -m pytest tests -q --tb=line --timeout=300 --timeout-method=thread --cov=pi_manager --cov-report=term-missing --cov-fail-under=55 | tee _pytest.log
        code=${PIPESTATUS[0]}
        if [ $code -ne 0 ]; then
          echo "::error::pytest failed with exit $code"
          grep -E "^(FAILED|ERROR)" _pytest.log | head -n 20 | sed 's/^/::error::/'
          echo "::error::---- tail ----"
          tail -n 30 _pytest.log | sed 's/^/::error::/'
          exit $code
        fi

    - name: Run tests (Windows/macOS)
      if: runner.os != 'Linux'
      shell: bash
      run: |
        python -m pytest tests -q --tb=line --timeout=300 --timeout-method=thread --cov=pi_manager --cov-report=term-missing --cov-fail-under=55 | tee _pytest.log
        code=${PIPESTATUS[0]}
        if [ $code -ne 0 ]; then
          echo "::error::pytest failed with exit $code"
          grep -E "^(FAILED|ERROR)" _pytest.log | head -n 20 | sed 's/^/::error::/'
          echo "::error::---- tail ----"
          tail -n 30 _pytest.log | sed 's/^/::error::/'
          exit $code
        fi

    - name: Self-check
      run: |
        python main.py --self-check

  extension-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extensions/pi-cursor/package-lock.json
      - name: Install + test Cursor extension
        working-directory: extensions/pi-cursor
        # --ignore-scripts：不执行依赖包的生命周期脚本，与运行时插件安装器
        # （v1.8.4 起强制）和 DEVELOPMENT_STANDARDS.md §7 的要求一致。
        run: |
          npm ci --ignore-scripts
          npm test

  # ---- 开发规范强制（docs/DEVELOPMENT_STANDARDS.md 第 8 节）----
  # 注意：以下 job 只覆盖 push main / PR 路径；发布路径（tag 推送 /
  # workflow_dispatch）由 build.yml 的 `gate` job 强制同一组门禁。

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install dev tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .

  secret-scan:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # check_secrets.py 是零第三方依赖的纯标准库脚本，不需要装任何依赖。
      - name: Secret / sensitive-file scan
        run: |
          python scripts/check_secrets.py --scan-tests

  consistency:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python deps
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
      # 覆盖版本单一来源 + 文档单一来源（docs/使用教程.md 由 help_docs.py 生成）
      - name: Version + docs single-source consistency
        run: python scripts/check_versions.py
      # test_help_docs.py 会 import pi_manager.ui（PySide6），Linux runner 需
      # GUI 库；与 test job 保持一致用 xvfb + offscreen 运行。
      - name: Standards consistency tests
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: :99
        run: |
          sudo apt-get update && sudo apt-get install -y \
            xvfb \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libfontconfig1 \
            libfreetype6
          xvfb-run -a python -m pytest tests/test_plugin_standards.py tests/test_help_docs.py -q

  # Nightly-only Linux packaging smoke. Kept separate from `test` so pull
  # requests never pay the PyInstaller cost; scheduled runs exercise the
  # spec chain (shared config extraction, version resource, smoke binary).
  nightly-packaging:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Linux GUI / smoke deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libfontconfig1 \
            libfreetype6 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxi6

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (Linux headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" python -m pytest tests -q -p no:cacheprovider --timeout=300 --timeout-method=thread --cov=pi_manager --cov-report=term-missing --cov-fail-under=55

      - name: Resolve version from extras.py
        id: ver
        shell: bash
        run: |
          echo "version=$(python -c "import re,pathlib;m=re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"',pathlib.Path('pi_manager/extras.py').read_text(encoding='utf-8'));print(m.group(1) if m else '0.0.0')")" >> "$GITHUB_OUTPUT"

      - name: PyInstaller (directory)
        run: python -m PyInstaller --noconfirm --clean PiManager.spec

      - name: Smoke test packaged binary
        shell: bash
        run: |
          export QT_QPA_PLATFORM=offscreen
          python scripts/smoke_test_dist.py \
            --platform linux \
            --dist dist \
            --expected-version "${{ steps.ver.outputs.version }}"

      - name: Upload nightly artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PiManager-nightly-linux
          path: dist/PiManager
          if-no-files-found: error
          # 此前用默认的 90 天：每天一份完整 onedir 产物，白占配额。
          retention-days: 7

  # 供应链审计（每日 schedule）。依赖全部 == 精确钉版，可复现性好，但此前没有
  # 任何机制发现这些钉死的版本出了 CVE——对一个把 cryptography / PySide6 打进
  # 二进制直接分发给终端用户的桌面应用，这是性价比最高的缺口（审查 P2-6）。
  # 不阻断（continue-on-error）：CVE 公布不该让无关的 PR 红掉，但必须可见。
  supply-chain:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit runtime dependencies
        continue-on-error: true
        run: pip-audit --requirement requirements.txt --strict --desc
      - name: Audit dev dependencies
        continue-on-error: true
        run: pip-audit --requirement requirements-dev.txt --strict --desc
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Audit Cursor extension dependencies
        continue-on-error: true
        working-directory: extensions/pi-cursor
        run: npm audit --audit-level=high
