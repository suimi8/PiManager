name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version label (e.g. 1.8.1)"
        required: true
        default: "1.8.1"
      upload_to_release:
        description: "Existing GitHub Release tag to upload into (e.g. v1.8.1). Leave empty for artifacts only."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}
    # Artifact upload and `gh release upload` need write scopes; keep them
    # job-local instead of global.
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Linux GUI / smoke deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libfontconfig1 \
            libfreetype6 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxi6

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests (pytest)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            xvfb-run -a -s "-screen 0 1024x768x24" python -m pytest tests -q -p no:cacheprovider
          else
            python -m pytest tests -q -p no:cacheprovider
          fi

      - name: Build macOS icon (.icns)
        if: matrix.platform == 'macos'
        run: bash scripts/make_icns.sh

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            # Fallback: derive the version from pi_manager/extras.py (single source of truth)
            # so that a bare "Run workflow" never drifts from the packaged APP_VERSION.
            echo "version=$(python -c "import re,pathlib;m=re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"',pathlib.Path('pi_manager/extras.py').read_text(encoding='utf-8'));print(m.group(1) if m else '0.0.0')")" >> "$GITHUB_OUTPUT"
          fi

      - name: PyInstaller (onefile, Windows)
        if: matrix.platform == 'windows'
        run: python -m PyInstaller --noconfirm --clean PiManagerOneFile.spec

      - name: PyInstaller (directory / app, macOS / Linux)
        if: matrix.platform != 'windows'
        run: python -m PyInstaller --noconfirm --clean PiManager.spec

      - name: Smoke test packaged binary
        shell: bash
        run: |
          export QT_QPA_PLATFORM=offscreen
          python scripts/smoke_test_dist.py \
            --platform "${{ matrix.platform }}" \
            --dist dist \
            --expected-version "${{ steps.ver.outputs.version }}"

      - name: Package release archives
        shell: bash
        run: |
          python scripts/package_release.py \
            --platform "${{ matrix.platform }}" \
            --version "${{ steps.ver.outputs.version }}"
          ls -lah release-assets

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PiManager-${{ matrix.platform }}-v${{ steps.ver.outputs.version }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: >
          startsWith(github.ref, 'refs/tags/v') ||
          github.event.inputs.upload_to_release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.upload_to_release }}"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "PiManager ${TAG}" --generate-notes
          fi
          # Upload archives only (skip plain text notes if desired, but notes are helpful)
          gh release upload "$TAG" release-assets/* --clobber

  package-vsix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Package Cursor extension
        working-directory: extensions/pi-cursor
        run: npm ci
      - name: Build Cursor extension package
        run: |
          python scripts/package_extension.py --out release-assets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PiManager-vsix
          path: release-assets/*.vsix
          if-no-files-found: error
      - name: Upload VSIX to GitHub Release
        if: >
          startsWith(github.ref, 'refs/tags/v') ||
          github.event.inputs.upload_to_release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.upload_to_release }}"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "PiManager ${TAG}" --generate-notes
          fi
          gh release upload "$TAG" release-assets/*.vsix --clobber
