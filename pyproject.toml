[project]
name = "pi-manager"
description = "跨平台桌面 GUI，用于配置、切换、测试与启动官方 Pi Coding Agent。"
# 支持的 Python 下界的**单一事实来源**。此前三处口径不一致：文档写 3.10+、
# ruff target-version 是 py311、CI 矩阵只测 3.11/3.12（3.10 从未被验证过）。
# 现统一为 3.11，README / BUILD.md / ruff / CI 矩阵都对齐到这里。
requires-python = ">=3.11"
# 版本单一来源是 pi_manager/extras.py 的 APP_VERSION（规范 R5），这里绝不重复
# 硬编码，否则就多了一个会漂移的版本源。本项目不作为 wheel 分发（源码运行 +
# PyInstaller 打包），因此不声明 [build-system]，也不需要构建后端来填这个字段。
dynamic = ["version"]

[tool.pytest.ini_options]
# 默认排除 integration 用例（真实 Pi CLI / 外网），避免本地与 CI 行为不一致。
# 需要运行时显式使用：pytest -m integration
# --strict-markers：marker 名写错（如 integraton）不再静默变成「不被
# -m 'not integration' 排除」的普通用例——那等于让它在 CI 上直接联网。
addopts = "-m 'not integration' --strict-markers"
testpaths = ["tests"]
# @pytest.mark.xfail 的用例真的通过时视为失败，避免"修好了但没人发现"。
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pi_manager", "scripts", "main.py"]
exclude = ["build", "dist", "release-assets", ".git", "node_modules", "work"]

[tool.ruff.lint]
# E4/E7/E9: 硬语法错误；F: pyflakes（未定义/未使用）。存量代码存在大量 W/I/UP/B
# 格式与现代化债务（见 docs/DEVELOPMENT_STANDARDS.md「存量债务」），CI 强制范围先收窄
# 到硬错误与未使用检测，随清理逐步放宽。
select = ["E4", "E7", "E9", "F"]
# 存量代码存在大量 >100 列行，E501 暂不强制；新代码请控制在 100 列内。
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# core.py 是公共 API 汇聚模块，大量 import 为 re-export（供 from pi_manager.core import X 使用），
# ruff 无法识别，误删会破坏下游（曾误删 ProviderKeyError）。此模块的 F401 作为存量债务
# 由 DEVELOPMENT_STANDARDS.md 记录，清理时需先确认无下游引用。
"pi_manager/core.py" = ["F401"]
# extras.py 同样是公共 API 汇聚模块（APP_VERSION 必须留在本文件）。
"pi_manager/extras.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["pi_manager"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
