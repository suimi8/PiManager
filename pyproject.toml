[tool.pytest.ini_options]
# 默认排除 integration 用例（真实 Pi CLI / 外网），避免本地与 CI 行为不一致。
# 需要运行时显式使用：pytest -m integration
addopts = "-m 'not integration'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["pi_manager", "scripts", "main.py"]
exclude = ["build", "dist", "release-assets", ".git", "node_modules", "work"]

[tool.ruff.lint]
# E4/E7/E9: 硬语法错误；F: pyflakes（未定义/未使用）。存量代码存在大量 W/I/UP/B
# 格式与现代化债务（见 docs/DEVELOPMENT_STANDARDS.md「存量债务」），CI 强制范围先收窄
# 到硬错误与未使用检测，随清理逐步放宽。
select = ["E4", "E7", "E9", "F"]
# 存量代码存在大量 >100 列行，E501 暂不强制；新代码请控制在 100 列内。
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# core.py 是公共 API 汇聚模块，大量 import 为 re-export（供 from pi_manager.core import X 使用），
# ruff 无法识别，误删会破坏下游（曾误删 ProviderKeyError）。此模块的 F401 作为存量债务
# 由 DEVELOPMENT_STANDARDS.md 记录，清理时需先确认无下游引用。
"pi_manager/core.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["pi_manager"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
